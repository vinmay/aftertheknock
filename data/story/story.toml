# Hand-written scenes. All characters are fictional.
#
# Placeholders: {pocket} is the player's object without an article ("bus ticket").
# effects: hand-authored canonical events committed when the scene is entered.
# kind:    fork1 | fork2 | crossing | map | final | ending (default: plain scene)

start = "opening"

# Unit 07 holds an older copy of the player's object. What gives it away depends on what it is made of.
[unit07_flaw]
paper = "Yours: the same crease, the same worn corner. But old, and dry, as if {it_has} been waiting here a long time. The ink on {it} has faded almost to nothing."
metal = "Yours: the same nick along one edge. But old, and dry, the finish gone dull, as if {it_has} been waiting here a long time. The engraving has worn almost smooth."
small = "Yours: the same chipped edge, the same pale scuff. But old, and dry, as if {it_has} been waiting here a long time. The scratches have worn nearly away."
unknown = "Yours: the same small flaw you would know anywhere. But old, and dry, as if {it_has} been waiting here a long time. Whatever marked {it} has worn nearly away."

# The one tactile mention of the pocket object before the knock. "abstract" covers inputs
# you can't hold ("regret", "a promise"): they become the same fallback object as an empty pocket.
[pocket_lines]
object = "In your pocket, your thumb finds the {pocket}. You've never been able to get rid of {it}."
empty = "You thought your pockets were empty. But your thumb catches a folded ticket stub. You don't remember keeping it."
abstract = "You carry {said} everywhere. Tonight your thumb also finds a folded ticket stub. You don't remember keeping it."

[scenes.opening]
clock = "11:47"
text = """
11:47 PM. The storm has been working at the windows for an hour.

Across the hall, 6D is dark. It has been dark most nights since March. Since the night Teo knocked on your door at two in the morning, and you stood on this side of it and didn't answer. The police came later. You never asked him why.

Someone knocks. Three times, evenly, the way people knock when they already know you're home.

Through the peephole: a woman in a dark coat, soaked through, hair flat against her face. She isn't shivering. She is looking straight into the lens, as if she can see you on the other side of it.

"Please," she says. "You already let me in."

You have never seen her before. Your hand is on the deadbolt. {pocket_line}
"""
kind = "fork1"
choices = [
  { label = "Open the door", fork = "open" },
  { label = "Lock it", fork = "lock" },
]

# ---------------------------------------------------------------- lock path
[scenes.lock_1]
clock = "11:48"
text = """
You turn the deadbolt. It is loud in the narrow entry, louder than it should be.

On the other side of the door, nothing. No knock. No footsteps. Then, softly, almost kindly:

"That's all right. You did, though."

Water runs out from under the door in a thin, straight line, as if it has somewhere to be.

Your hand stays on the lock. You know this feeling. You had it in March.
"""
choices = [{ label = "Keep watching", next = "lock_2" }]

[scenes.lock_2]
clock = "11:52"
text = """
She crosses the hall to 6D and knocks. Teo's door. Teo, who hasn't opened his door to anyone since March. Not the super. Not you.

For a moment the chain lifts. Then it drops again. You know how long a person can stand behind a door without answering.

She says something to the wood that you can't hear.

Then she walks to the stairwell, and the fire door sighs shut behind her. Down. Not up. You can hear her going down for a long time.
"""
effects = [["set", "chars.mara.location", "stairwell"]]
choices = [{ label = "Step away from the door", next = "lock_3" }]

[scenes.lock_3]
clock = "11:58"
power = "out"
text = """
The lights go out at 11:58. The fridge stops humming, and in the quiet you hear the building the way you never do: pipes, wind in the elevator shaft, something settling in the walls.

You sit on the floor with your back against the locked door, because it seems like the only fixed thing in the apartment.

Somewhere far below, a metal door closes. Then, very faintly, someone laughs.

It sounds like you.
"""
effects = [["set", "chars.mara.location", "basement"]]
choices = [{ label = "Take out the {pocket}", next = "crossing1" }]

[scenes.lock_fork2]
clock = "12:06"
text = """
At 12:06 there is a sound at Teo's door: the chain, the bolt, the chain again. It opens two inches. One eye. A strip of grey cardigan.

"She was in there," he says. "With you. I heard her in your apartment."

You start to tell him that's impossible, that your door has been locked all night.

"I heard you lock it," he says. "I heard you open it, too. I always hear you." A pause. "I heard you in March. On the other side of the door."

He looks toward the stairwell. "She went down. If you trust me, don't. Go up. Up is just weather."

The door closes. The chain.
"""
kind = "fork2"
choices = [
  { label = "Follow Mara — go down to the basement", fork = "basement" },
  { label = "Trust Teo — go up to the roof", fork = "roof" },
]

[scenes.lock_basement]
clock = "12:13"
text = """
Six flights in the dark, one hand on the rail. The basement is dry, which is wrong; the storm is everywhere else.

Storage cages in rows, numbered in stencil. At the far end, unit 07, still padlocked. Mara sits on the concrete in front of it with the brass key in her lap, as if she is waiting for a bus.

"There you are," she says. "Both of you are late."
"""
effects = [["set", "chars.player.location", "stairwell"], ["set", "chars.player.location", "basement"]]
choices = [{ label = "Ask her what's in 07", next = "lock_basement_2" }]

[scenes.lock_basement_2]
clock = "12:15"
text = """
"A night," she says. "Not this one. One somebody put away instead of living it."

She stands and steps aside. The cage door is held by a padlock you have never seen on anything in this building: no keyhole, just four brass dials, green at the edges.

"The key was never for that," Mara says. "I never had the number."

She looks at your pocket.

"You do."

"I need someone else to see it," she says. "Someone who'll tell Teo he wasn't imagining things."
"""
choices = [{ label = "Dial {digits}", next = "unit07_open" }]

[scenes.lock_roof]
clock = "12:13"
text = """
The roof door sticks, then gives, and the storm takes the breath out of you. The city is dark to the river. The whole grid, not just your building. Water stands on the tar in sheets.

You are alone up here. You are sure of that for almost a minute.

Below the parapet, one window on the sixth floor is open to the storm. 6D. Teo is leaning out of it, looking up at you, rain in his face.

"I wasn't asking you to save me," he calls. "In March. I just needed somebody else to hear it."

He looks at your hands.

"The numbers on {c1_on}. That's the lock on 07. She never had them." The window closes.

Then the stairwell door bangs shut behind you, though nobody came through it.
"""
effects = [["set", "chars.player.location", "stairwell"], ["set", "chars.player.location", "roof"]]
choices = [{ label = "Turn around", next = "crossing2" }]

# ---------------------------------------------------------------- open path
[scenes.open_1]
clock = "11:48"
text = """
You open the door. She steps past you before you have decided to step aside, and the cold comes in with her.

"Thank you," she says. "Again."

You opened it this time. The relief lasts less than a second.

Up close she is younger than you thought, and older. Water runs off her coat and pools around her shoes and doesn't spread. In her hand is a brass key on a paper tag. The tag says BASEMENT 07 in faded marker.
"""
choices = [{ label = "Ask who she is", next = "open_2" }]

[scenes.open_2]
clock = "11:51"
text = """
"Mara," she says, as though you have asked her that many times. She sits at your table without taking off the coat.

"I need to go down to 07," she says. "And I need someone to see what's in it. Someone who'll tell Teo he wasn't imagining things." She turns the key over and over. "He's never opened his door for me. Not once."

A pause.

"That isn't true. He did tonight. Not here. Somewhere else."
"""
choices = [{ label = "\"Somewhere else?\"", next = "open_3" }]

[scenes.open_3]
clock = "11:58"
power = "out"
text = """
The lights go out at 11:58. Mara doesn't react. In the dark you can hear the water leaving her coat, steady as a clock.

"There are nights people try to forget," she says. "That doesn't mean nobody is still inside them."

The key stops turning.

"Look at the tag."
"""
choices = [{ label = "Look at the key", next = "crossing1" }]

[scenes.open_fork2]
clock = "12:06"
text = """
Mara stands. "I can show you what's in 07. After that, you decide what deserves to stay."

Across the hall, Teo's chain lifts.

"Don't go down with her," he says through the gap. "Go up. Up is just weather."

Mara looks at his door for a long moment. "He's never trusted a door in his life," she says. "Neither have you."
"""
kind = "fork2"
choices = [
  { label = "Follow Mara — go down to the basement", fork = "basement" },
  { label = "Trust Teo — go up to the roof", fork = "roof" },
]

[scenes.open_basement]
clock = "12:13"
text = """
She goes first. Six flights, and her hand never touches the rail. The basement is dry, which is wrong; the storm is everywhere else.

Storage cages in rows, numbered in stencil. Unit 07 at the far end, padlocked. Mara holds out the key, but not toward the lock. Toward you.

"You do it," she says. "It has to be someone who's still deciding."
"""
effects = [["set", "chars.player.location", "stairwell"], ["set", "chars.mara.location", "stairwell"],
           ["set", "chars.player.location", "basement"], ["set", "chars.mara.location", "basement"]]
choices = [{ label = "Reach for the key", next = "open_basement_2" }]

[scenes.open_basement_2]
clock = "12:15"
text = """
The key turns in the cage door's lock without a sound. The door still doesn't move.

Below the keyhole hangs a second lock you have never seen on anything in this building: a padlock with four brass dials, green at the edges.

Mara holds the paper tag up between you, so the storm light from the high window falls on it. On the digits that weren't there an hour ago.

"Go on," she says.
"""
choices = [{ label = "Dial {digits}", next = "unit07_open" }]

[scenes.open_roof]
clock = "12:13"
text = """
You leave her at your table. She doesn't argue. "I'll be here," she says. "I'm very good at it."

The roof door sticks, then gives. The storm, the black city, water standing on the tar. You stand in it until you are as wet as she was.

Below the parapet, one window on the sixth floor is open to the storm. 6D. Teo is leaning out of it, looking up at you, rain in his face.

"I wasn't asking you to save me," he calls. "In March. I just needed somebody else to hear it."

He looks at your hands.

"The numbers on {c1_on}. That's the lock on 07. She never had them." The window closes.

Behind you, the stairwell door bangs shut, though nobody came through it.
"""
effects = [["set", "chars.player.location", "stairwell"], ["set", "chars.player.location", "roof"]]
choices = [{ label = "Turn around", next = "crossing2" }]

# ---------------------------------------------------------------- shared
[scenes.unit07_open]
clock = "12:16"
text = """
The dials are cold and stiff. {digits}.

The shackle drops open with a sound like a held breath let go.

Inside 07 there is a folding chair, facing the door. {on_the_seat} {unit07_flaw}

Mara doesn't go in. "That's from March," she says. "From the night you answered him."
"""
effects = [["set", "places.unit07.locked", false]]
effect_summary = "You dial {digits}. The padlock on 07 opens."
evidence = "crossing1"
choices = [{ label = "Step back from the cage", next = "crossing2" }]


[scenes.crossing1]
clock = "12:01"
kind = "crossing"
shadow = "B"
choices = [{ label = "Keep going", next = "$fork2" }]

[scenes.crossing2]
clock = "12:18"
kind = "crossing"
shadow = "D"
choices = [{ label = "Keep going", next = "map" }]

[scenes.map]
clock = "12:19"
kind = "map"
text = """
There were other versions of tonight. In some of them, you answered. In others, you didn't.

Everything that found you came from somewhere. Follow a thread.
"""
choices = [{ label = "Go on", next = "the_other_you" }]

# The climax. Authored scenes, after the map has shown every committed shadow event. They state only
# the player's own choices (inverted), committed facts of shadow B (chosen by conditions on the log),
# and the March backstory. No effects, no event ids: nothing here enters the timeline.
[scenes.the_other_you]
authored = true
sound = "knock"
hush = true
text = """
The map folds back into the dark.

Three knocks.

Not on your door. On a door in front of you that wasn't there a moment ago. The same paint. The same brass peephole. The same scratch beside the lock.

Your door.

You put your eye to the peephole.

Someone is standing on the other side, soaked through. Your coat. Your hands. Your face.

For a second you think it's a mirror.

Then the person blinks.

You didn't.
"""
choices = [{ label = "Continue", next = "confrontation" }]

[scenes.confrontation]
authored = true
hush = true
text = """
"I know what you chose," they say. It's your voice, from the wrong side of the wood.

"I remember standing where you stood."

{other_choice}

{other_detail}

{other_march}

{other_d}

They put a palm flat against the door. You can hear them breathing. Exactly as you are.

"Why do you get to be the real one?"
"""
choices = [{ label = "Continue", next = "final" }]

[scenes.final]
clock = "12:20"
kind = "final"
text = """
The knocking stops. They're waiting.

Close the door, and the other you is gone. You won't have to hear them again.

Open it, and give them a chance. Neither of you knows what happens when two versions of one life meet.
"""
hush = true
choices = [
  { label = "Erase the other night", ending = "erase" },
  { label = "Open the door and let it through", ending = "open" },
]

# ---------------------------------------------------------------- endings
# Slots are filled by the engine from committed shadow facts.
[endings.erase]
clock = "12:30"
text = """
You choose this night. Only this one.

The person behind the door stops knocking. For the first time, their face looks completely familiar. Not because it is yours. Because you know the expression. It's the face you make when you know no one is coming.

{erase_marks}

{erase_mara}

At 12:30 every light in the building comes back at once, and the fridge begins to hum as if nothing happened.

Then, three knocks. Slow. Patient.

You don't move until they stop.

Somewhere, you made a different choice.
"""

[endings.open]
clock = "12:31"
text = """
You turn the lock. On the other side, a hand settles against the wood exactly where yours is.

The other night comes in quietly, the way Mara did. It smells like rain that never reached this building.

{open_objects}

{open_mara}

{open_teo}

You look at what the night left you. {open_marks}

The other you is standing in the doorway. They look relieved. Then uncertain. Neither of you knows who should step back.

Somewhere, you made a different choice.
"""

[endings.slots]
erase_marks = "\"{b_text}\" fades from {b_on}, and \"{d_text}\" from {d_on}, like breath off a mirror, and then there is nothing left to read."
erase_mara_present = "When you look up, Mara is gone. Where she stood, the floor is dry."
erase_mara_absent = "Far below, a metal door closes, gently, and does not open again."

# Object lines are built from each object's committed final holder in both nights (same or different),
# told by feel rather than as a state report.
object_same = "{Obj} {is} {here}. {It} always {was}."
object_split = "{Obj} {is} {here}. And {it} {is} {there}. You can feel both, like holding one thing in two hands."

# Mara, from her committed position in each night.
mara_same = "Mara is {here}. She looks relieved, and very tired, like someone who has been holding a door shut for a long time."
mara_split = "Mara is {here}. She is also {there}; you can hear her, and she can hear herself. She doesn't look surprised."

open_teo_hurt = "In 6D, Teo is sitting on his kitchen floor, holding his arm, not sure how he hurt it. This time you hear him. This time you cross the hall and knock."
open_teo_dead = "In 6D, there is no sound at all. In March, he knocked and you didn't answer. Tonight, nobody will knock for him."
open_teo_fine = "In 6D, Teo turns off his radio. \"Finally,\" he says. To no one. Or to you."

# ---- the other you (scene "confrontation"). Each slot is filled only from the player's own choices,
# committed events of shadow B, or the March backstory; a slot with no supported variant is left out.
other_choice_lock = "\"I opened it. I let her in. She was telling the truth.\""
other_choice_open = "\"I kept it locked. I sat against the door and listened to everything.\""
# Player locked: B is the night where the door was opened. {verb_on} is the material-aware act.
other_detail_took = "\"She took the {pocket} out of my hand and {verb_it}. I let her.\""
other_detail_watched = "\"She {verb_the}. I watched her do it.\""
other_detail_self = "\"I {verb_it} myself. I didn't know where {it_sub} would go.\""
# Player opened: B is the night where the door stayed locked.
other_detail_teo_open = "\"Teo opened his door for her. I heard the chain. He never opens it for anyone.\""
other_detail_tag = "\"Somebody wrote {b_text} on the key's tag out there. I heard it all through the wood.\""
other_march_lock = "\"I would have opened it for Teo, too.\""
other_march_open = "\"You should have done what I did. You always did, before.\""
other_d_basement = "\"And I'm not the only one. One of us went up to the roof. You left that one too.\""
other_d_roof = "\"And I'm not the only one. One of us went down to 07. You left that one too.\""
# The other you's account of a mark, by what it was made on (as in the flashbacks).
other_verb_paper = "wrote {b_text} on {obj}"
other_verb_scratched = "scratched {b_text} into {obj}"
other_verb_unknown = "marked {obj} with {b_text}"

# After crossing 1, one line from the player's own first choice (never a shadow fact).
echo_lock = "You locked the door. Somewhere, you didn't."
echo_open = "You opened the door. Somewhere, you didn't."

open_marks = "{b_line} {d_line} Both made in a night you never lived."
mark_line_paper = "\"{text}\" on {on}, in {writing}."
mark_line_scratched = "\"{text}\" scratched into {on}, by {hand}."
mark_line_unknown = "\"{text}\" on {on}, marked by {hand}."

# ---------------------------------------------------------------- crossings
# Hand-written lines around each crossing. The engine slots in the committed facts:
# the inscription, the object, whose handwriting. Key: mark_<object>[_<situation>],
# situation = yours | held (someone beside you holds it) | arrived_seen / arrived_unseen (it turned
# up at your feet; "seen" means you had been in the same place as it earlier in your own night).
[crossings.mark_pocket]
before = "You take out the {pocket}."
after = "That wasn't there when you put {it} in your pocket."

[crossings.mark_pocket_arrived]
before = "Something light drops at your feet. Your {pocket}. You didn't feel {it} leave your pocket."
after = "That wasn't there when you put {it} in your pocket."

[crossings.mark_key07_held]
before = "{holder} turns the key over in the dark. The paper tag catches the storm light."
after = "That wasn't on the tag a minute ago."

[crossings.mark_key07_arrived_seen]
before = "Something small and heavy clicks against the floor by your feet. The brass key, tagged BASEMENT 07. Nobody threw it."
after = "The writing wasn't there when you last saw the key."

[crossings.mark_key07_arrived_unseen]
before = "Something small and heavy clicks against the floor by your feet. A brass key on a paper tag that says BASEMENT 07. Nobody threw it."
after = "You've never seen this key before. Yet someone has written on its tag."

[crossings.mark_other]
before = "You look down."
after = "That wasn't there a minute ago."

# Who made the mark, by what it was made on: paper is written on; metal and small hard
# things are scratched; anything else is just "marked". Never call a ring "paper".
[crossings.writer]
mara = "The handwriting isn't yours."
teo = "The handwriting isn't yours, and it isn't hers."
player = "It's your handwriting. You don't remember writing it."

[crossings.writer_scratched]
mara = "The hand that cut it isn't yours."
teo = "The hand that cut it isn't yours, and it isn't hers."
player = "It's your hand that cut it. You don't remember doing it."

[crossings.writer_unknown]
mara = "Whoever marked it, it wasn't you."
teo = "Whoever marked it, it wasn't you, and it wasn't her."
player = "It's your mark. You don't remember making it."

# ---------------------------------------------------------------- flashbacks
# A crossing's memory: one line per event committed in that shadow, up to the mark.
# Only these templates are used; an event without one falls back to the plain sentence.
# {A} actor, {T} person acted on, {obj} object, {on} what was written on, {place}, {text}, {from}.
[flashback]
move = "{A} goes to {place}."
speak_to = "“{text}” {A} says it to {T}."
speak_aloud = "“{text}” {A} says it to no one."
give = "{A} hands {obj} to {T}."
take = "{A} takes {obj}{from}."
mark = "{A} writes “{text}” on {on}."
# used when the line before already named the same object
mark_again = "{A} writes “{text}” across {it}."
# metal and small hard objects: scratched in; anything else: marked
mark_scratched = "{A} scratches “{text}” into {on}."
mark_again_scratched = "{A} scratches “{text}” into {it}."
mark_unknown = "{A} marks {on} with “{text}”."
mark_again_unknown = "{A} marks {it} with “{text}”."
open = "{A} unlocks {place}."
hide = "{A} hides {obj}."
discover = "{A} finds {obj}."
harm = "{A} hurts {T}."
closing_numbers = "This is where the numbers came from."
closing_words = "This is where the words came from."
