[project]
name = "knock"
version = "0.1.0"
description = "A horror story where the choice you didn't make keeps happening in a hidden timeline."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
knock = "knock.cli:main"
knock-server = "knock.api:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
